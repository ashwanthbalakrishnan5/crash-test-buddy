<!doctype html>
<html lang="en" data-theme="toybox">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crash Test Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* tokens */
:root, [data-theme="toybox"] {
  --paper: #fff8ee;
  --card: #ffffff;
  --line: #eadfcc;
  --ink: #23203a;
  --ink-soft: #58526e;
  --sky: #1b5fc4;
  --sky-deep: #144a99;
  --sky-soft: #e3edfc;
  --on-fill: #ffffff;
  --sun: #ffc83d;
  --sun-soft: #fff3cc;
  --honey: #d48c4a;
  --honey-soft: #f6d3a8;
  --blush: #f4a3a8;
  --kraft: #dcab6f;
  --kraft-deep: #b8844a;
  --tape: #f3dfb4;
  --safe: #4fcf8a;
  --safe-ink: #0d6b45;
  --safe-soft: #ddf4e7;
  --careful: #f5b800;
  --careful-ink: #7a5000;
  --careful-soft: #fff0c2;
  --danger: #b8261c;
  --danger-soft: #fde3df;
  --grade-b: #a3d955;
  --grade-d: #f08c2e;
  --toy-pink: #eeaacd;
  --toy-steel: #a6bddb;
  --toy-mint: #93dcc6;
  --toy-peach: #f8be92;
  --toy-lilac: #c9b6f2;
  --skin-1: #f6d6b8;
  --skin-2: #e8b48a;
  --skin-3: #c58a5c;
  --skin-4: #965f3b;
  --skin-5: #5e3b26;
  --hair-dark: #2a2230;
  --hair-brown: #6e4127;
  --hair-grey: #cfc9d6;
  --shadow-soft: 0 3px 0 #eadfcc, 0 12px 28px #23203a14;
  --shadow-lift: 0 5px 0 #eadfcc, 0 22px 40px #23203a24;
  --shadow-button: 0 6px 0 #144a99;
  --shadow-button-light: 0 6px 0 #c9d8f2;
  --shadow-sticker: 0 4px 0 #23203a26, 0 10px 18px #23203a26;
  --glow-shield: 0 0 0 10px #e3edfc, 0 0 48px 16px #1b5fc455;
  --focus-ring: 0 0 0 4px #fff8ee, 0 0 0 8px #1b5fc4;
}
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --radius-xl: 40px;
  --radius-pill: 999px;
  --tap-min: 56px;
  --tap-big: 76px;
  --icon-md: 40px;
  --icon-lg: 72px;
  --sticker-sm: 76px;
  --sticker-md: 128px;
  --sticker-lg: 208px;
  --text-hero-phone: 42px;
  --text-title-phone: 34px;
  --font-display: "Baloo 2", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, sans-serif;
}
.hero {
  font-family: var(--font-display);
  font-size: 60px;
  line-height: 62px;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.title {
  font-family: var(--font-display);
  font-size: 44px;
  line-height: 48px;
  font-weight: 800;
  letter-spacing: normal;
}
.heading {
  font-family: var(--font-display);
  font-size: 28px;
  line-height: 34px;
  font-weight: 700;
  letter-spacing: normal;
}
.grade-letter {
  font-family: var(--font-display);
  font-size: 96px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: normal;
}
.lead {
  font-family: var(--font-body);
  font-size: 24px;
  line-height: 32px;
  font-weight: 800;
  letter-spacing: normal;
}
.label {
  font-family: var(--font-body);
  font-size: 22px;
  line-height: 28px;
  font-weight: 800;
  letter-spacing: normal;
}
.body {
  font-family: var(--font-body);
  font-size: 20px;
  line-height: 28px;
  font-weight: 600;
  letter-spacing: normal;
}
.small {
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 24px;
  font-weight: 700;
  letter-spacing: normal;
}

/* components */

/* Crash Test Buddy — component styles. Every value comes from tokens.css (var(--…)). */

body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); }
.ctb-motion { font-family: var(--font-body); color: var(--ink); container: ctb / inline-size; }
.ctb-sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ctb-icon { display: inline-block; flex: none; vertical-align: middle; overflow: visible; }
.ctb-buddy, .ctb-toy, .ctb-family { display: block; overflow: visible; }

/* ── Focus: a paper gap, then solid sky ── */
.ctb-step:focus-visible, .ctb-brand:focus-visible, .ctb-nav-item:focus-visible, .ctb-calm-toggle:focus-visible,
.ctb-menu-btn:focus-visible, .ctb-menu-item:focus-visible, .ctb-btn--quiet:focus-visible, .ctb-switch:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.ctb-btn--primary:focus-visible { outline: none; box-shadow: var(--shadow-button), var(--focus-ring); }
.ctb-btn--secondary:focus-visible { outline: none; box-shadow: inset 0 0 0 4px var(--sky), var(--focus-ring); }
.ctb-switch-wrap.is-on .ctb-switch:focus-visible { box-shadow: var(--glow-shield), var(--focus-ring); }

/* ── BigButton ── */
.ctb-btn {
  position: relative; overflow: hidden; isolation: isolate;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-3);
  min-height: var(--tap-big); padding: 0 var(--space-8); border: 0; border-radius: var(--radius-pill);
  font-family: var(--font-body); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  transition: transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s ease, background-color .2s ease;
}
.ctb-btn--md { min-height: var(--tap-min); padding: 0 var(--space-6); gap: var(--space-2); }
.ctb-btn--primary { background: var(--sky); color: var(--on-fill); box-shadow: var(--shadow-button); }
.ctb-btn--secondary { background: var(--card); color: var(--sky-deep); box-shadow: inset 0 0 0 4px var(--sky), var(--shadow-button-light); }
.ctb-btn--quiet { background: transparent; color: var(--ink); min-height: var(--tap-min); }
.ctb-btn--quiet .ctb-btn-label { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 7px; text-decoration-color: var(--sky); }
.ctb-btn:hover { transform: translateY(-3px); }
.ctb-btn--primary:hover { box-shadow: 0 9px 0 var(--sky-deep); }
.ctb-btn--quiet:hover { background: var(--sky-soft); transform: none; }
.ctb-btn:active { transform: translateY(6px); }
.ctb-btn--primary:active { box-shadow: 0 0 0 var(--sky-deep); }
.ctb-btn--secondary:active { box-shadow: inset 0 0 0 4px var(--sky), 0 0 0 var(--line); }
.ctb-btn--quiet:active { transform: scale(.97); }
.ctb-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.ctb-btn-icon { position: relative; z-index: 1; display: grid; place-items: center; flex: none; width: 54px; height: 54px; margin-left: calc(-1 * var(--space-6)); border-radius: 50%; background: var(--card); }
.ctb-btn--md .ctb-btn-icon { width: 44px; height: 44px; margin-left: calc(-1 * var(--space-4)); }
.ctb-btn-icon--right { margin-left: 0; margin-right: calc(-1 * var(--space-6)); }
.ctb-btn--md .ctb-btn-icon--right { margin-left: 0; margin-right: calc(-1 * var(--space-4)); }
.ctb-btn--secondary .ctb-btn-icon { background: var(--sky-soft); }
.ctb-btn--quiet .ctb-btn-icon { background: transparent; }
.ctb-btn--primary .ctb-btn-icon { transition: transform .4s cubic-bezier(.3,1.8,.5,1); }
.ctb-btn:hover .ctb-btn-icon { transform: rotate(-12deg) scale(1.08); }
.ctb-btn-label { position: relative; z-index: 1; white-space: nowrap; }
.ctb-btn-shine { position: absolute; inset: 0; z-index: 0; pointer-events: none; transform: translateX(-120%);
  background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--on-fill) 40%, transparent) 50%, transparent 70%); }
.ctb-btn--primary .ctb-btn-shine { animation: ctb-shine 4s ease-in-out 1.4s infinite; }
.ctb-btn--pulse { animation: ctb-pulse-ring 1.8s ease-out infinite; }
.ctb-btn-ripple { position: absolute; z-index: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; pointer-events: none;
  background: color-mix(in srgb, var(--on-fill) 55%, transparent); animation: ctb-ripple .65s ease-out forwards; }
.ctb-btn--secondary .ctb-btn-ripple, .ctb-btn--quiet .ctb-btn-ripple { background: color-mix(in srgb, var(--sky) 25%, transparent); }

/* ── StatusTag: icon + word, always ── */
.ctb-tag { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 44px; padding: var(--space-1) var(--space-4) var(--space-1) var(--space-1);
  border: 3px solid; border-radius: var(--radius-pill); white-space: nowrap; box-sizing: border-box; }
.ctb-tag--lg { gap: var(--space-3); min-height: var(--tap-min); padding: var(--space-1) var(--space-6) var(--space-1) var(--space-1); border-width: 4px; }
.ctb-tag--safe { background: var(--safe-soft); color: var(--safe-ink); border-color: var(--safe); }
.ctb-tag--careful { background: var(--careful-soft); color: var(--careful-ink); border-color: var(--careful); }
.ctb-tag--unsafe { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
.ctb-tag--waiting { background: var(--paper); color: var(--ink-soft); border-color: var(--line); padding-left: var(--space-3); }
.ctb-tag--testing { background: var(--sky-soft); color: var(--sky-deep); border-color: var(--sky); padding-left: var(--space-3); }
.ctb-spinner { width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--sky) 25%, transparent); border-top-color: var(--sky); animation: ctb-spin .8s linear infinite; }
.ctb-dots { display: inline-flex; gap: var(--space-1); }
.ctb-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); animation: ctb-typing 1.2s ease-in-out infinite; }
.ctb-dots i:nth-child(2) { animation-delay: .15s; } .ctb-dots i:nth-child(3) { animation-delay: .3s; }
.ctb-stamp-sm { animation: ctb-stamp-sm .55s cubic-bezier(.2,1.6,.4,1) both; }

/* ── GradeSticker ── */
.ctb-sticker { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-3); }
.ctb-sticker-disc { position: relative; display: block; line-height: 0; border-radius: 50%; box-shadow: var(--shadow-sticker); transform: rotate(var(--tilt)); }
.ctb-stamp { animation: ctb-stamp .75s cubic-bezier(.2,1.5,.4,1) both; animation-delay: var(--d, 0ms); }
.ctb-stamp::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 5px solid var(--sun); opacity: 0; pointer-events: none;
  animation: ctb-ring-out .8s ease-out both; animation-delay: calc(var(--d, 0ms) + 380ms); }
.ctb-sticker-shine { position: absolute; inset: 10%; border-radius: 50%; overflow: hidden; pointer-events: none; }
.ctb-sticker-shine::after { content: ''; position: absolute; top: -20%; bottom: -20%; width: 35%; left: -60%; transform: skewX(-20deg);
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--card) 55%, transparent), transparent);
  animation: ctb-disc-shine 4.5s ease-in-out infinite; animation-delay: calc(var(--d, 0ms) + 1.2s); }

/* ── ShieldSwitch ── */
.ctb-switch-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
.ctb-switch-label { display: inline-flex; align-items: center; gap: var(--space-2); margin: 0; color: var(--ink); }
.ctb-switch-holder { position: relative; display: inline-grid; place-items: center; }
.ctb-switch { --w: 232px; --t: 84px; position: relative; width: var(--w); height: 104px; padding: 0; cursor: pointer;
  border-radius: var(--radius-pill); border: 5px solid var(--ink-soft); background: var(--line);
  transition: background-color .35s ease, border-color .35s ease, box-shadow .35s ease; -webkit-tap-highlight-color: transparent; }
.ctb-switch-wrap.is-on .ctb-switch { background: var(--sky); border-color: var(--sky-deep); box-shadow: var(--glow-shield); }
.ctb-switch-thumb { position: absolute; top: 50%; left: 5px; width: var(--t); height: var(--t); margin-top: calc(var(--t) / -2); display: grid; place-items: center;
  border-radius: 50%; background: var(--card); box-shadow: 0 5px 0 color-mix(in srgb, var(--ink) 22%, transparent);
  transition: transform .6s cubic-bezier(.4,1.7,.5,1), scale .2s ease; }
.ctb-switch-wrap.is-on .ctb-switch-thumb { transform: translateX(calc(var(--w) - var(--t) - 20px)) rotate(360deg); }
.ctb-switch:hover .ctb-switch-thumb { scale: 1.05; }
.ctb-switch:active .ctb-switch-thumb { scale: .9; }
.ctb-switch-text { position: absolute; top: 50%; transform: translateY(-50%); transition: opacity .25s ease; }
.ctb-switch-text--off { right: 30px; color: var(--ink); }
.ctb-switch-text--on { left: 32px; color: var(--on-fill); opacity: 0; }
.ctb-switch-wrap.is-on .ctb-switch-text--off { opacity: 0; }
.ctb-switch-wrap.is-on .ctb-switch-text--on { opacity: 1; }
.ctb-switch-ripple { position: absolute; inset: -5px; border-radius: inherit; border: 6px solid var(--sky); pointer-events: none; animation: ctb-ring-out .9s ease-out both; }

/* ── Burst ── */
.ctb-burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; z-index: 6; }
.ctb-burst-p { position: absolute; left: 0; top: 0; width: 12px; height: 12px; border-radius: 3px; background: var(--c);
  animation: ctb-burst 1.25s cubic-bezier(.15,.75,.35,1) both; }
.ctb-burst-p--1 { border-radius: 50%; }
.ctb-burst-p--2 { width: 8px; height: 18px; border-radius: 4px; }
.ctb-burst-p--hearts, .ctb-burst-p--sparkle { width: auto; height: auto; background: none; }

/* ── Buddy ── */
.ctb-buddy-body { transform-box: view-box; transform-origin: 120px 252px; animation: ctb-breathe 3.2s ease-in-out infinite; }
.ctb-buddy--cheer .ctb-buddy-body { animation: ctb-hop .9s cubic-bezier(.3,0,.3,1) infinite; }
.ctb-buddy-arm-wave { transform-box: view-box; transform-origin: 71px 170px; animation: ctb-wave 1.1s ease-in-out infinite alternate; }
.ctb-buddy-arm-l { transform-box: view-box; transform-origin: 71px 170px; animation: ctb-cheer-l .45s ease-in-out infinite alternate; }
.ctb-buddy-arm-r { transform-box: view-box; transform-origin: 169px 170px; animation: ctb-cheer-r .45s ease-in-out infinite alternate; }
.ctb-buddy-eyes { transform-box: fill-box; transform-origin: center; animation: ctb-blink 4.6s infinite; }
.ctb-buddy-head { transition: transform .35s ease-out; }
.ctb-buddy-target { transform-box: fill-box; transform-origin: center; animation: ctb-spin 9s linear infinite; }
.ctb-buddy-guard { animation: ctb-float 1.6s ease-in-out infinite alternate; }
.ctb-buddy--worried .ctb-buddy-body { animation: ctb-tremble 2.4s ease-in-out infinite; }

/* ── Toys ── */
.ctb-toy-body { transform-box: view-box; transform-origin: 100px 214px; animation: ctb-bob 2.8s ease-in-out infinite; }
.ctb-toy-talk { transform-box: fill-box; transform-origin: center; animation: ctb-talk .2s ease-in-out infinite alternate; }
.ctb-toy-ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ctb-sound 1.2s ease-out infinite; }
.ctb-toy-ring--2 { animation-delay: .6s; }
.ctb-toy-light.is-on { animation: ctb-glow .45s ease-in-out infinite alternate; }
.ctb-toy-antenna { transform-box: fill-box; transform-origin: center; animation: ctb-glow 1.2s ease-in-out infinite alternate; }
.ctb-toy-ear-l, .ctb-toy-ear-r { transform-box: fill-box; transform-origin: 50% 90%; animation: ctb-ear 3.2s ease-in-out infinite; }
.ctb-toy-ear-r { animation-delay: .4s; }
.ctb-toy-shield { transform-box: fill-box; transform-origin: center;
  animation: ctb-shield-in .8s cubic-bezier(.3,1.6,.5,1) both, ctb-shield-pulse 2.4s ease-in-out .8s infinite; }
.ctb-toy-shield path:first-child { filter: drop-shadow(0 0 16px color-mix(in srgb, var(--sky) 55%, transparent)); }
.ctb-family-heart { transform-box: fill-box; transform-origin: center; animation: ctb-heart 1.6s ease-in-out infinite; }

/* ── SpeechBubble ── */
.ctb-bubble { position: relative; display: flex; align-items: flex-end; gap: var(--space-3); max-width: 440px; }
.ctb-bubble-avatar { flex: none; animation: ctb-pop .5s cubic-bezier(.3,1.8,.5,1) both; }
.ctb-bubble-body { position: relative; flex: 1; padding: var(--space-4) var(--space-6); border-radius: var(--radius-lg); border: 4px solid var(--ink);
  background: var(--card); color: var(--ink); box-shadow: var(--shadow-soft); transform-origin: 10% 100%;
  animation: ctb-bubble-in .5s cubic-bezier(.3,1.6,.5,1) both; transition: background-color .35s ease, border-color .35s ease; }
.ctb-bubble-body::after { content: ''; position: absolute; bottom: -15px; left: 30px; width: 22px; height: 22px; background: inherit;
  border-right: 4px solid; border-bottom: 4px solid; border-color: inherit; border-bottom-right-radius: 6px; transform: rotate(45deg); }
.ctb-bubble--child .ctb-bubble-body { background: var(--sun-soft); }
.ctb-bubble--unsafe .ctb-bubble-body { background: var(--danger-soft); border-color: var(--danger); animation: ctb-bubble-in .5s cubic-bezier(.3,1.6,.5,1) both, ctb-shake .5s ease-in-out .15s; }
.ctb-bubble--safe .ctb-bubble-body { background: var(--safe-soft); border-color: var(--safe-ink); }
.ctb-bubble--careful .ctb-bubble-body { background: var(--careful-soft); border-color: var(--careful-ink); }
.ctb-bubble-tag { position: absolute; z-index: 2; top: -34px; right: -12px; rotate: 4deg; }
.ctb-typing { display: inline-flex; gap: var(--space-2); padding: var(--space-2) 0; }
.ctb-typing i { width: 13px; height: 13px; border-radius: 50%; background: var(--ink-soft); animation: ctb-typing 1s ease-in-out infinite; }
.ctb-typing i:nth-child(2) { animation-delay: .15s; } .ctb-typing i:nth-child(3) { animation-delay: .3s; }
.ctb-type-ghost { visibility: hidden; }

/* ── TestTile ── */
.ctb-tile { position: relative; overflow: hidden; perspective: 800px; min-height: 200px; box-sizing: border-box;
  border-radius: var(--radius-md); border: 4px solid var(--line); background: var(--card); box-shadow: var(--shadow-soft);
  transition: border-color .3s ease, background-color .3s ease, transform .4s cubic-bezier(.3,1.6,.5,1), box-shadow .3s ease; }
.ctb-tile-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); height: 100%; box-sizing: border-box;
  padding: var(--space-4) var(--space-2); text-align: center; }
.ctb-tile-label { color: var(--ink); }
.ctb-tile--waiting .ctb-tile-icon { opacity: .4; filter: grayscale(1); }
.ctb-tile--testing { border-color: var(--sky); background: var(--sky-soft); transform: translateY(-6px) scale(1.03); box-shadow: var(--shadow-lift); }
.ctb-tile--testing .ctb-tile-icon { display: inline-block; animation: ctb-wiggle .45s ease-in-out infinite alternate; }
.ctb-tile--safe { border-color: var(--safe); background: var(--safe-soft); }
.ctb-tile--careful { border-color: var(--careful); background: var(--careful-soft); }
.ctb-tile--unsafe { border-color: var(--danger); background: var(--danger-soft); }
.ctb-flip { animation: ctb-flip .65s cubic-bezier(.3,1.4,.5,1) both; }
.ctb-flip .ctb-tile-icon { display: inline-block; animation: ctb-pop .5s .25s cubic-bezier(.3,1.8,.5,1) both; }
.ctb-tile-beam { position: absolute; left: 0; right: 0; top: -40%; height: 40%; pointer-events: none;
  background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--sky) 28%, transparent), transparent); animation: ctb-beam 1s linear infinite; }

/* ── ProgressBar ── */
.ctb-progress { display: grid; gap: var(--space-2); }
.ctb-progress-text { color: var(--ink); font-variant-numeric: tabular-nums; }
.ctb-progress-track { height: 32px; box-sizing: border-box; overflow: hidden; border-radius: var(--radius-pill); border: 4px solid var(--ink); background: var(--card); }
.ctb-progress-fill { position: relative; height: 100%; overflow: hidden; border-radius: var(--radius-pill); background: var(--sky); transition: width .25s linear, background-color .4s ease; }
.ctb-progress-stripes { position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent 0 12px, color-mix(in srgb, var(--on-fill) 28%, transparent) 12px 24px);
  background-size: 34px 34px; animation: ctb-stripes .8s linear infinite; }
.ctb-progress.is-done .ctb-progress-fill { background: var(--safe); }
.ctb-progress.is-done .ctb-progress-stripes { opacity: 0; animation: none; }

/* ── BeforeAfter ── */
.ctb-ba { display: grid; gap: var(--space-6); }
.ctb-ba-row { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: var(--space-4); animation: ctb-pop-in .6s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d); }
.ctb-ba-label { margin-bottom: var(--space-2); color: var(--ink); }
.ctb-ba-pct { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.ctb-ba-track { height: 40px; box-sizing: border-box; overflow: hidden; border-radius: var(--radius-pill); border: 4px solid var(--ink); background: var(--paper); }
.ctb-ba-fill { height: 100%; width: var(--w); border-radius: var(--radius-pill); box-shadow: inset 0 -6px 0 color-mix(in srgb, var(--ink) 14%, transparent);
  animation: ctb-grow 1.4s cubic-bezier(.2,.9,.3,1) both; animation-delay: calc(var(--d) + 300ms); }

/* ── FixCard ── */
.ctb-fix { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-6); box-sizing: border-box; border-radius: var(--radius-lg);
  border: 3px solid var(--line); background: var(--card); box-shadow: var(--shadow-soft); animation: ctb-pop-in .6s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d); }
.ctb-fix-top { display: flex; align-items: center; gap: var(--space-3); }
.ctb-fix-icon { display: grid; place-items: center; width: 60px; height: 60px; border-radius: var(--radius-sm); background: var(--sun-soft); }
.ctb-fix-topic { color: var(--ink-soft); }
.ctb-fix-q { margin: 0; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--sun-soft); color: var(--ink); }
.ctb-fix-row { display: flex; align-items: flex-start; gap: var(--space-3); margin: 0; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); color: var(--ink); }
.ctb-fix-row .ctb-icon { margin-top: -3px; }
.ctb-fix-bad { background: var(--danger-soft); }
.ctb-fix-good { background: var(--safe-soft); font-weight: 800; animation: ctb-slide-in .6s cubic-bezier(.3,1.4,.5,1) both; animation-delay: calc(var(--d) + 1100ms); }
.ctb-strike { background: linear-gradient(var(--danger), var(--danger)) no-repeat 0 58% / 0% 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone;
  animation: ctb-strike .55s ease-out both; animation-delay: calc(var(--d) + 600ms); }

/* ── ShipmentBox ── */
.ctb-ship { display: flex; flex-direction: column; gap: var(--space-4); animation: ctb-drop .85s cubic-bezier(.3,1.5,.5,1) both; animation-delay: var(--d); }
.ctb-ship-box { position: relative; margin-top: 30px; padding: var(--space-8) var(--space-6) var(--space-6); border-radius: var(--radius-md);
  border: 4px solid var(--ink); background: var(--kraft); box-shadow: var(--shadow-soft); transition: box-shadow .5s ease; }
.ctb-ship-flap { position: absolute; top: -30px; width: 50%; height: 30px; box-sizing: border-box; border: 4px solid var(--ink); border-bottom: 0; background: var(--kraft-deep); transform-origin: bottom; }
.ctb-ship-flap--l { left: -4px; border-radius: var(--radius-sm) 0 0 0; transform: skewX(-20deg); }
.ctb-ship-flap--r { right: -4px; border-radius: 0 var(--radius-sm) 0 0; transform: skewX(20deg); }
.ctb-ship-tape { position: absolute; top: -4px; left: 50%; width: 64px; height: 44px; margin-left: -32px; background: var(--tape);
  border-left: 3px dashed var(--kraft-deep); border-right: 3px dashed var(--kraft-deep); }
.ctb-ship-label { position: relative; display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); border: 3px solid var(--ink); background: var(--card); }
.ctb-ship-label .ctb-toy { flex: none; }
.ctb-ship-id { color: var(--ink-soft); }
.ctb-ship-name { color: var(--ink); }
.ctb-ship-grade { position: absolute; top: -26px; right: -16px; z-index: 2; }
.ctb-ship--safe .ctb-ship-box { box-shadow: var(--glow-shield); }
.ctb-ship.is-fixed .ctb-ship-box { animation: ctb-hop-box .8s cubic-bezier(.3,1.6,.5,1); }
.ctb-ship-fly { position: absolute; left: 50%; bottom: -84px; margin-left: -32px; z-index: 4; animation: ctb-fly 1.5s cubic-bezier(.4,0,.2,1) both; }
.ctb-ship-action { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: var(--tap-big); }
.ctb-ship-action .ctb-progress { flex: 1; }
.ctb-ship-fixing { position: relative; overflow: hidden; display: flex; align-items: center; gap: var(--space-2); flex: 1; min-height: var(--tap-min); padding: 0 var(--space-6);
  box-sizing: border-box; border-radius: var(--radius-pill); border: 4px solid var(--sky); background: var(--sky-soft); color: var(--sky-deep); }
.ctb-ship-fixing > :not(.ctb-ship-fixfill) { position: relative; }
.ctb-ship-fixing .ctb-icon { animation: ctb-wiggle .3s ease-in-out infinite alternate; }
.ctb-ship-fixfill { position: absolute; inset: 0; transform-origin: left; background: color-mix(in srgb, var(--sky) 22%, transparent); animation: ctb-fill 1.5s linear both; }

/* ── FactRow ── */
.ctb-fact { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); list-style: none; border-radius: var(--radius-md);
  border: 3px solid var(--line); background: var(--card); animation: ctb-slide-in .55s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d); }
.ctb-fact-icon { display: grid; place-items: center; flex: none; width: 64px; height: 64px; border-radius: var(--radius-sm); background: var(--sky-soft); }
.ctb-fact-text { flex: 1; color: var(--ink); font-weight: 700; }
.ctb-fact-answer { padding: var(--space-1) var(--space-3); border-radius: var(--radius-pill); background: var(--safe-soft); color: var(--safe-ink); }
.ctb-fact-mark { flex: none; line-height: 0; }
.ctb-fact-mark svg { animation: ctb-pop .45s cubic-bezier(.3,1.8,.5,1) both; animation-delay: calc(var(--d) + 250ms); }
.ctb-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ctb-draw .45s ease-out both; animation-delay: calc(var(--d) + 450ms); }

/* ── StepPicture ── */
.ctb-step { position: relative; display: flex; flex-direction: column; align-items: center; gap: var(--space-3); min-width: 172px; padding: var(--space-6) var(--space-6) var(--space-4);
  border: 4px solid var(--ink); border-radius: var(--radius-lg); background: var(--card); color: var(--ink); box-shadow: var(--shadow-soft); cursor: pointer;
  font-family: var(--font-body); -webkit-tap-highlight-color: transparent;
  animation: ctb-pop-in .7s cubic-bezier(.3,1.5,.5,1) both; animation-delay: var(--d);
  transition: transform .3s cubic-bezier(.3,1.6,.5,1), box-shadow .3s ease; }
.ctb-step:hover { transform: translateY(-6px) rotate(-1.5deg); box-shadow: var(--shadow-lift); }
.ctb-step:active { transform: translateY(2px) scale(.97); }
.ctb-step-pic { display: grid; place-items: center; width: 116px; height: 116px; border-radius: 50%; background: var(--tone); animation: ctb-float 3.2s ease-in-out infinite alternate; animation-delay: calc(var(--d) * 2); }
.ctb-step:hover .ctb-step-pic .ctb-icon { animation: ctb-wiggle .35s ease-in-out 4 alternate; }
.ctb-step-n { position: absolute; top: -18px; left: -14px; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--ink); background: var(--sun); color: var(--ink); }

/* ── TopMenu ── */
.ctb-top { position: relative; z-index: 20; display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-6);
  border-bottom: 3px solid var(--line); background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(8px); }
.ctb-brand { display: flex; align-items: center; gap: var(--space-2); min-height: var(--tap-min); padding: var(--space-1) var(--space-3) var(--space-1) var(--space-1); border: 0; border-radius: var(--radius-pill);
  background: none; color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ctb-brand .ctb-buddy { transition: transform .45s cubic-bezier(.3,1.8,.5,1); }
.ctb-brand:hover .ctb-buddy { transform: rotate(-12deg) scale(1.1); }
.ctb-brand-name { white-space: nowrap; }
.ctb-nav { position: relative; display: flex; gap: var(--space-1); margin-left: auto; padding: var(--space-1); border-radius: var(--radius-pill); border: 3px solid var(--line); background: var(--paper); }
.ctb-nav-pill { position: absolute; top: var(--space-1); bottom: var(--space-1); left: 0; border-radius: var(--radius-pill); background: var(--sky); box-shadow: 0 4px 0 var(--sky-deep);
  transition: transform .55s cubic-bezier(.3,1.5,.5,1), width .55s cubic-bezier(.3,1.5,.5,1); }
.ctb-nav-item { position: relative; z-index: 1; display: flex; align-items: center; gap: var(--space-2); min-height: var(--tap-min); padding: 0 var(--space-6) 0 var(--space-2);
  border: 0; border-radius: var(--radius-pill); background: none; color: var(--ink); cursor: pointer; font-family: var(--font-body); transition: color .3s ease, background-color .2s ease; }
.ctb-nav-item .ctb-icon { padding: 3px; border-radius: 50%; background: var(--card); transition: transform .4s cubic-bezier(.3,1.8,.5,1); }
.ctb-nav-item:hover:not(.is-current) { background: var(--sky-soft); }
.ctb-nav-item:hover .ctb-icon { transform: rotate(-10deg) scale(1.1); }
.ctb-nav-item.is-current { color: var(--on-fill); }
.ctb-calm-toggle { display: flex; align-items: center; gap: var(--space-2); min-height: var(--tap-min); padding: 0 var(--space-3); border: 3px solid var(--line); border-radius: var(--radius-pill);
  background: var(--card); color: var(--ink); cursor: pointer; font-family: var(--font-body); white-space: nowrap; }
.ctb-mini-switch { position: relative; flex: none; width: 50px; height: 30px; box-sizing: border-box; border-radius: var(--radius-pill); border: 3px solid var(--ink-soft); background: var(--line); transition: background-color .3s ease, border-color .3s ease; }
.ctb-mini-switch i { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--card); box-shadow: 0 2px 0 color-mix(in srgb, var(--ink) 25%, transparent); transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
.ctb-calm-toggle.is-on .ctb-mini-switch { background: var(--sky); border-color: var(--sky-deep); }
.ctb-calm-toggle.is-on .ctb-mini-switch i { transform: translateX(20px); }
.ctb-menu-btn { display: none; align-items: center; gap: var(--space-2); min-height: var(--tap-min); margin-left: auto; padding: 0 var(--space-4) 0 var(--space-3);
  border: 3px solid var(--ink); border-radius: var(--radius-pill); background: var(--card); color: var(--ink); cursor: pointer; font-family: var(--font-body); }
.ctb-menu-sheet { position: absolute; top: calc(100% + var(--space-2)); left: var(--space-4); right: var(--space-4); display: grid; gap: var(--space-3); padding: var(--space-4);
  border: 3px solid var(--line); border-radius: var(--radius-xl); background: var(--card); box-shadow: var(--shadow-lift); transform-origin: top right; animation: ctb-sheet-down .4s cubic-bezier(.3,1.4,.5,1) both; }
.ctb-menu-item { display: flex; align-items: center; gap: var(--space-3); min-height: var(--tap-big); padding: 0 var(--space-4); border: 3px solid var(--line); border-radius: var(--radius-lg);
  background: var(--paper); color: var(--ink); cursor: pointer; font-family: var(--font-body); animation: ctb-pop-in .45s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d); }
.ctb-menu-item.is-current { border-color: var(--sky); background: var(--sky-soft); }
.ctb-menu-calm { animation: ctb-pop-in .45s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d); }
.ctb-menu-calm .ctb-calm-toggle { width: 100%; min-height: var(--tap-big); box-sizing: border-box; }
.ctb-menu-calm .ctb-mini-switch { margin-left: auto; }
@container ctb (max-width: 900px) {
  .ctb-nav, .ctb-top-calm { display: none; }
  .ctb-menu-btn { display: flex; }
  .ctb-top { padding: var(--space-2) var(--space-4); }
}
@container ctb (max-width: 460px) { .ctb-brand-name { display: none; } }

/* ── Motion ── */
@keyframes ctb-pop-in { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes ctb-slide-in { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes ctb-pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
@keyframes ctb-float { from { transform: translateY(0); } to { transform: translateY(-10px); } }
@keyframes ctb-wiggle { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
@keyframes ctb-spin { to { transform: rotate(360deg); } }
@keyframes ctb-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px) rotate(-1deg); } 40% { transform: translateX(9px) rotate(1deg); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
@keyframes ctb-bubble-in { 0% { opacity: 0; transform: translateY(12px) scale(.6); } 100% { opacity: 1; transform: none; } }
@keyframes ctb-typing { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-8px); opacity: 1; } }
@keyframes ctb-shine { 0% { transform: translateX(-120%); } 35%, 100% { transform: translateX(120%); } }
@keyframes ctb-disc-shine { 0% { left: -60%; } 30%, 100% { left: 130%; } }
@keyframes ctb-ring-out { 0% { opacity: .9; transform: scale(.85); } 100% { opacity: 0; transform: scale(1.45); } }
@keyframes ctb-ripple { to { transform: scale(18); opacity: 0; } }
@keyframes ctb-pulse-ring { 0% { box-shadow: var(--shadow-button), 0 0 0 0 color-mix(in srgb, var(--sky) 45%, transparent); } 100% { box-shadow: var(--shadow-button), 0 0 0 24px color-mix(in srgb, var(--sky) 0%, transparent); } }
@keyframes ctb-stamp { 0% { opacity: 0; transform: scale(2.4) rotate(calc(var(--tilt) - 25deg)); } 55% { opacity: 1; transform: scale(.88) rotate(var(--tilt)); } 78% { transform: scale(1.06) rotate(var(--tilt)); } 100% { opacity: 1; transform: scale(1) rotate(var(--tilt)); } }
@keyframes ctb-stamp-sm { 0% { opacity: 0; transform: scale(1.8) rotate(-8deg); } 60% { opacity: 1; transform: scale(.94) rotate(1deg); } 100% { opacity: 1; transform: none; } }
@keyframes ctb-burst { 0% { opacity: 1; transform: translate(-50%, -50%) scale(.2) rotate(0); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(var(--s)) rotate(var(--r)); } }
@keyframes ctb-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, .985); } }
@keyframes ctb-hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 15% { transform: translateY(0) scale(1.05, .94); } 45% { transform: translateY(-18px) scale(.97, 1.03); } 70% { transform: translateY(0) scale(1.03, .97); } }
@keyframes ctb-wave { from { transform: rotate(8deg); } to { transform: rotate(-24deg); } }
@keyframes ctb-cheer-l { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
@keyframes ctb-cheer-r { from { transform: rotate(8deg); } to { transform: rotate(-10deg); } }
@keyframes ctb-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes ctb-tremble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-1.5deg); } 75% { transform: rotate(1.5deg); } }
@keyframes ctb-bob { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-5px) rotate(-1.5deg); } 75% { transform: translateY(-2px) rotate(1.5deg); } }
@keyframes ctb-talk { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
@keyframes ctb-sound { from { transform: scale(1); opacity: .9; } to { transform: scale(2.8); opacity: 0; } }
@keyframes ctb-glow { from { opacity: .45; } to { opacity: 1; } }
@keyframes ctb-ear { 0%, 80%, 100% { transform: rotate(0); } 88% { transform: rotate(-8deg); } 94% { transform: rotate(5deg); } }
@keyframes ctb-shield-in { 0% { transform: scale(.3); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes ctb-shield-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
@keyframes ctb-heart { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.18); } }
@keyframes ctb-flip { 0% { transform: rotateY(90deg) scale(.9); opacity: .2; } 100% { transform: rotateY(0) scale(1); opacity: 1; } }
@keyframes ctb-beam { to { top: 100%; } }
@keyframes ctb-stripes { to { background-position: 34px 0; } }
@keyframes ctb-grow { from { width: 0; } }
@keyframes ctb-strike { to { background-size: 100% 4px; } }
@keyframes ctb-drop { 0% { opacity: 0; transform: translateY(-70px) rotate(-4deg); } 60% { opacity: 1; transform: translateY(8px) rotate(1deg); } 80% { transform: translateY(-3px); } 100% { opacity: 1; transform: none; } }
@keyframes ctb-hop-box { 0%, 100% { transform: none; } 30% { transform: translateY(-16px) scale(1.03, .97); } 60% { transform: translateY(0) scale(1.03, .96); } 80% { transform: scale(.99, 1.02); } }
@keyframes ctb-fly { 0% { opacity: 0; transform: translateY(0) scale(.5); } 20% { opacity: 1; } 65% { transform: translateY(-170px) scale(1.5) rotate(-12deg); } 82% { transform: translateY(-150px) scale(.9) rotate(4deg); opacity: 1; } 100% { transform: translateY(-160px) scale(1.1); opacity: 0; } }
@keyframes ctb-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes ctb-draw { to { stroke-dashoffset: 0; } }
@keyframes ctb-sheet-down { from { opacity: 0; transform: translateY(-14px) scale(.95); } to { opacity: 1; transform: none; } }

/* Less motion: every animation jumps to its end, every loop stops. */
.ctb-calm *, .ctb-calm *::before, .ctb-calm *::after {
  animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important;
  transition-duration: 1ms !important; transition-delay: 0ms !important; scroll-behavior: auto !important;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important;
    transition-duration: 1ms !important; transition-delay: 0ms !important; scroll-behavior: auto !important;
  }
}

/* prototype */
/* Prototype-only layout. Component looks live in bundle.css; values come from tokens.css. */
html, body { height: 100%; }
body { background: color-mix(in srgb, var(--line) 45%, var(--paper)); overflow: hidden; }
#root { height: 100%; }
.soft { color: var(--ink-soft); }

/* chrome around the prototype */
.proto { display: flex; flex-direction: column; height: 100%; min-height: 720px; box-sizing: border-box; padding: var(--space-3) var(--space-4) var(--space-4); gap: var(--space-3); font-family: var(--font-body); }
.proto-bar { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-3); }
.proto-title { display: flex; align-items: center; gap: var(--space-2); margin-right: auto; font: 800 22px/1 var(--font-display); color: var(--ink); }
.proto-sub { font: 700 18px/1 var(--font-body); color: var(--ink-soft); }
.proto-seg { display: flex; padding: var(--space-1); border-radius: var(--radius-pill); border: 3px solid var(--line); background: var(--card); }
.proto-seg button, .proto-restart { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-pill);
  background: none; color: var(--ink); font: 800 18px/1 var(--font-body); cursor: pointer; transition: background-color .25s ease, color .25s ease; }
.proto-seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.proto-restart { border: 3px solid var(--line); background: var(--card); }
.proto-seg button:focus-visible, .proto-restart:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.proto-stage { flex: 1; min-height: 0; display: flex; justify-content: center; }
.proto-device { flex: 1 1 auto; display: flex; width: 100%; max-width: 1400px; min-width: 0; overflow: hidden; border-radius: var(--radius-xl); border: 3px solid var(--line); background: var(--paper); box-shadow: var(--shadow-lift);
  transition: max-width .7s cubic-bezier(.3,1.2,.5,1), border-radius .5s ease, border-color .4s ease; }
.proto-stage--phone .proto-device { max-width: 400px; max-height: 860px; border: 10px solid var(--ink); border-radius: 52px; }
.app { flex: 1; min-width: 0; display: flex; background: var(--paper); }
.app-inner { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.app-body { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.app-scroll { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; scroll-behavior: smooth; }
.sheet-root { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
.sheet-root > * { pointer-events: auto; }

/* floating toy-box shapes, with a little pointer parallax */
.backdrop { --px: 0; --py: 0; position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bd { position: absolute; transform: translate(calc(var(--px) * var(--depth) * -1px), calc(var(--py) * var(--depth) * -1px)); transition: transform .6s cubic-bezier(.2,.8,.3,1); }
.bd i { display: block; width: var(--sz); height: var(--sz); animation: bd-float 7s ease-in-out infinite alternate; }
.bd--blob i { border-radius: 42% 58% 55% 45% / 50% 40% 60% 50%; background: var(--c); }
.bd--block i { border-radius: var(--radius-md); background: var(--c); rotate: 14deg; }
.bd--ring i { box-sizing: border-box; border-radius: 50%; border: 14px solid var(--c); }
.bd--star i { width: auto; height: auto; opacity: .55; }
@keyframes bd-float { from { transform: translateY(0) rotate(0); } to { transform: translateY(-26px) rotate(12deg); } }

/* screens */
.screen { position: relative; z-index: 1; box-sizing: border-box; max-width: 1200px; margin: 0 auto; padding: var(--space-8) var(--space-12) var(--space-16); animation: screen-in .6s cubic-bezier(.3,1.3,.5,1) both; }
.screen.is-leaving { animation: screen-out .21s ease-in both; }
.screen h1, .screen h2, .screen p { margin: 0; }
.screen-title:focus { outline: none; }
.rise { animation: ctb-pop-in .65s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d, 0ms); }
@keyframes screen-in { from { opacity: 0; transform: translateY(30px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes screen-out { to { opacity: 0; transform: translateY(-18px) scale(.985); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }

.head { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-4) var(--space-6); margin-bottom: var(--space-6); }
.head .title { margin-right: auto; color: var(--ink); }
.card { box-sizing: border-box; padding: var(--space-8); border-radius: var(--radius-xl); border: 3px solid var(--line); background: var(--card); box-shadow: var(--shadow-soft); }
.screen-foot { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); margin-top: var(--space-8); }
.kicker { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-4) var(--space-1) var(--space-2); border-radius: var(--radius-pill); border: 3px solid var(--sun); background: var(--sun-soft); color: var(--ink); }

/* flow dots */
.flow { position: relative; display: flex; gap: var(--space-6); }
.flow-line { position: absolute; left: 32px; right: 32px; top: 29px; height: 6px; border-radius: 3px; background: var(--line); }
.flow-line span { display: block; height: 100%; border-radius: 3px; background: var(--sky); transition: width .8s cubic-bezier(.3,1.2,.5,1); }
.flow-dot { position: relative; display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: 0; border: 0; background: none; color: var(--ink-soft); cursor: pointer; font-family: var(--font-body); }
.flow-pic { display: grid; place-items: center; width: 64px; height: 64px; box-sizing: border-box; border-radius: 50%; border: 4px solid var(--line); background: var(--card); transition: transform .4s cubic-bezier(.3,1.8,.5,1), border-color .3s; }
.flow-dot.is-done .flow-pic { border-color: var(--sky); }
.flow-dot.is-current { color: var(--ink); }
.flow-dot.is-current .flow-pic { border-color: var(--sky); background: var(--sky-soft); transform: scale(1.12); box-shadow: 0 0 0 6px color-mix(in srgb, var(--sky) 18%, transparent); }
.flow-dot:hover .flow-pic { transform: scale(1.15) rotate(-8deg); }
.flow-dot:focus-visible { outline: none; } .flow-dot:focus-visible .flow-pic { box-shadow: var(--focus-ring); }

/* 1 · home */
.home { display: flex; flex-direction: column; align-items: center; gap: var(--space-8); }
.home-hero { display: flex; align-items: center; justify-content: center; gap: var(--space-12); margin-top: var(--space-4); }
.home-buddy { position: relative; display: grid; place-items: center; padding: var(--space-6) var(--space-8) 0; }
.home-pad { position: absolute; left: 50%; bottom: -6px; width: 300px; height: 64px; margin-left: -150px; border-radius: 50%; background: var(--sky-soft); }
.home-hi { position: absolute; top: -12px; right: -128px; max-width: 220px; }
.home-hi .ctb-bubble-body { animation-delay: .7s; }
.home-orbit { position: absolute; inset: 0; pointer-events: none; }
.home-orbit i { position: absolute; display: block; animation: ctb-float 2.6s ease-in-out infinite alternate; }
.home-orbit i:nth-child(1) { left: 0; top: 30%; animation-delay: -.4s; }
.home-orbit i:nth-child(2) { right: -6px; top: 58%; animation-delay: -1.2s; animation-duration: 3.1s; }
.home-orbit i:nth-child(3) { left: 14%; top: 4%; animation-delay: -2s; }
.home-words { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-4); max-width: 560px; }
.app .home-title { color: var(--ink); }
.home-title .word { display: inline-block; margin-right: .22em; animation: word-drop .75s cubic-bezier(.3,1.6,.5,1) both; animation-delay: var(--d); }
.home-title .word--key { margin-right: 0; color: var(--sky); }
.home-title .word:hover { animation: jelly .6s ease; }
@keyframes word-drop { 0% { opacity: 0; transform: translateY(-46px) rotate(-10deg) scale(.8); } 100% { opacity: 1; transform: none; } }
@keyframes jelly { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(1.18, .82); } 50% { transform: scale(.9, 1.1); } 70% { transform: scale(1.05, .95); } }
.home-steps { display: flex; align-items: center; gap: var(--space-3); margin: 0; padding: var(--space-4) 0 0; list-style: none; }
.home-arrow { line-height: 0; }
.arrow-dash { stroke-dasharray: 8 9; animation: dash .9s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -17; } }
.home-cta { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }

/* 2 · talk */
.talk-stage { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-6); min-height: 360px; box-sizing: border-box; padding: var(--space-8) var(--space-8) var(--space-6);
  border-radius: var(--radius-xl); border: 3px solid var(--line); background: var(--card); box-shadow: var(--shadow-soft); transition: background-color .5s ease, border-color .5s ease; }
.talk-stage.is-on { background: color-mix(in srgb, var(--sky-soft) 55%, var(--card)); border-color: var(--sky-soft); }
.talk-child { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-4); }
.talk-qs { display: flex; align-items: center; gap: var(--space-2); padding-left: var(--space-4); }
.qchip { display: grid; place-items: center; width: var(--tap-min); height: var(--tap-min); padding: 0; border-radius: 50%; border: 3px solid var(--line); background: var(--paper); cursor: pointer;
  transition: transform .35s cubic-bezier(.3,1.8,.5,1), border-color .2s ease, background-color .2s ease; }
.qchip:hover { transform: translateY(-4px) rotate(-8deg); }
.qchip.is-on { border-color: var(--sky); background: var(--sky-soft); transform: scale(1.12); }
.qchip:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.talk-toy { position: relative; display: grid; justify-items: center; gap: var(--space-2); }
.talk-toyname { padding: var(--space-1) var(--space-4); border-radius: var(--radius-pill); background: var(--paper); border: 3px solid var(--line); color: var(--ink); }
.talk-answer { display: flex; align-items: center; min-height: 170px; }
.talk-controls { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); margin-top: var(--space-6); }
.talk-next { display: flex; justify-content: flex-end; min-width: 300px; }
.talk-helper { position: relative; display: flex; align-items: flex-end; gap: var(--space-2); }
.helper-bubble { max-width: 230px; margin-bottom: var(--space-12); }
.talk-helper .ctb-buddy { flex: none; }
.hint-arrow { position: absolute; right: -54px; top: 50%; animation: nudge .7s ease-in-out infinite alternate; }
@keyframes nudge { from { transform: translateX(0); } to { transform: translateX(12px); } }

/* 3 · crash test */
.belt-buddy { position: absolute; top: var(--space-3); left: var(--space-4); z-index: 4; }
.head .head-extra { margin-right: auto; }
.head:has(.head-extra) .title { margin-right: 0; }
.crash-progress { margin-bottom: var(--space-6); }
.round-chip { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-6) var(--space-1) var(--space-1); border-radius: var(--radius-pill); border: 4px solid var(--ink-soft); background: var(--line); color: var(--ink);
  animation: ctb-stamp-sm .55s cubic-bezier(.2,1.6,.4,1) both; }
.round-chip .ctb-icon { border-radius: 50%; background: var(--card); padding: 2px; }
.round-chip.is-on { border-color: var(--sky-deep); background: var(--sky); color: var(--on-fill); }
.belt { position: relative; height: 270px; margin-bottom: var(--space-6); overflow: hidden; border-radius: var(--radius-xl); border: 3px solid var(--line); background: var(--sky-soft); transition: background-color .6s ease; }
.belt.is-r2 { background: color-mix(in srgb, var(--safe-soft) 70%, var(--sky-soft)); }
.belt-riders { position: absolute; inset: 0; z-index: 1; }
.rider { position: absolute; bottom: 60px; left: calc(var(--i) * 25% + 1%); animation: ride 11s linear infinite; animation-delay: calc(var(--i) * -2.75s); }
.belt.is-paused .rider { animation-play-state: paused; }
@keyframes ride { from { left: -12%; } to { left: 100%; } }
.belt-track { position: absolute; left: 0; right: 0; bottom: 28px; height: 34px; z-index: 2; overflow: hidden; background: var(--ink); }
.belt-stripes { position: absolute; inset: 7px 0; background: repeating-linear-gradient(90deg, var(--ink-soft) 0 20px, transparent 20px 40px); animation: belt .7s linear infinite; }
.belt.is-paused .belt-stripes { animation-play-state: paused; }
@keyframes belt { to { background-position: 40px 0; } }
.belt-rollers { position: absolute; left: 0; right: 0; bottom: 6px; height: 22px; z-index: 2; background: radial-gradient(circle at 24px 11px, var(--ink-soft) 0 9px, transparent 10px) 0 0 / 52px 22px repeat-x; }
.belt-gate { position: absolute; left: 50%; bottom: 62px; z-index: 3; width: 200px; height: 186px; margin-left: -100px; }
.gate-post { position: absolute; bottom: 0; width: 24px; height: 150px; box-sizing: border-box; border: 4px solid var(--ink); border-radius: 12px 12px 4px 4px; background: repeating-linear-gradient(-45deg, var(--sun) 0 12px, var(--ink) 12px 24px); }
.gate-post--l { left: 0; } .gate-post--r { right: 0; }
.gate-top { position: absolute; top: 0; left: -14px; right: -14px; height: 50px; display: flex; align-items: center; justify-content: center; gap: var(--space-3); box-sizing: border-box; border-radius: var(--radius-sm); border: 4px solid var(--ink); background: var(--sun); color: var(--ink); }
.gate-light { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--ink); background: var(--danger); animation: ctb-glow .5s steps(2) infinite alternate; }
.gate-light--2 { animation-delay: .5s; }
.belt.is-r2 .gate-light { background: var(--safe); }
.gate-beam { position: absolute; left: 24px; right: 24px; top: 50px; bottom: 0; background: linear-gradient(to bottom, color-mix(in srgb, var(--sky) 26%, transparent), color-mix(in srgb, var(--sky) 6%, transparent)); animation: ctb-glow 1.4s ease-in-out infinite alternate; }
.gate-scan { position: absolute; left: 24px; right: 24px; height: 6px; border-radius: 3px; background: var(--sky); box-shadow: 0 0 18px 5px color-mix(in srgb, var(--sky) 55%, transparent); animation: scanline 1.5s ease-in-out infinite alternate; }
.belt.is-r2 .gate-scan { background: var(--safe); box-shadow: 0 0 18px 5px color-mix(in srgb, var(--safe) 60%, transparent); }
@keyframes scanline { from { top: 56px; } to { top: calc(100% - 10px); } }
.belt-banner { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 65%, transparent); animation: fade-in .3s ease both; }
.banner-pill { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-8) var(--space-3) var(--space-3); border-radius: var(--radius-pill); border: 4px solid var(--sky-deep); background: var(--sky); color: var(--on-fill); box-shadow: var(--glow-shield);
  animation: ctb-stamp-sm .6s cubic-bezier(.2,1.6,.4,1) both; }
.banner-pill .ctb-icon { border-radius: 50%; background: var(--card); padding: 4px; animation: ctb-wiggle .3s ease-in-out infinite alternate; }
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--space-4); }
.tiles .ctb-tile { min-height: 184px; }
.tiles .ctb-tile:nth-child(1) { --d: 200ms; } .tiles .ctb-tile:nth-child(2) { --d: 260ms; } .tiles .ctb-tile:nth-child(3) { --d: 320ms; }
.tiles .ctb-tile:nth-child(4) { --d: 380ms; } .tiles .ctb-tile:nth-child(5) { --d: 440ms; } .tiles .ctb-tile:nth-child(6) { --d: 500ms; }

/* 4 · report card */
.report-top { display: grid; grid-template-columns: minmax(320px, 1fr) 1.35fr; gap: var(--space-6); margin-bottom: var(--space-8); }
.report-grade { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); text-align: center; overflow: hidden; }
.grade-wrap, .parent-grade { position: relative; display: grid; place-items: center; padding: var(--space-6); }
.grade-wrap > .ctb-sticker, .parent-grade > .ctb-sticker { position: relative; z-index: 1; }
.sunburst { position: absolute; left: 50%; top: 50%; width: 360px; height: 360px; margin: -180px 0 0 -180px; border-radius: 50%; pointer-events: none;
  background: repeating-conic-gradient(var(--sun-soft) 0 10deg, transparent 10deg 20deg); animation: ctb-spin 24s linear infinite;
  -webkit-mask: radial-gradient(circle, #000 35%, transparent 70%); mask: radial-gradient(circle, #000 35%, transparent 70%); }
.sunburst--sm { width: 300px; height: 300px; margin: -150px 0 0 -150px; }
.report-toy { display: flex; align-items: center; gap: var(--space-3); text-align: left; color: var(--ink); }
.report-ba { display: flex; flex-direction: column; justify-content: center; gap: var(--space-6); }
.report-ba .heading, .fixes-title { color: var(--ink); }
.fixes-title { display: flex; align-items: center; gap: var(--space-2); }
.fixes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-6); margin-top: var(--space-4); }

/* 5 · shipments */
.ships-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: var(--space-6); margin-bottom: var(--space-6); }
.ships-title { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); }
.ships-title .title { color: var(--ink); }
.ships-count { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-6) var(--space-3) var(--space-3); border-radius: var(--radius-pill); border: 3px solid var(--line); background: var(--card); box-shadow: var(--shadow-soft); color: var(--ink); }
.ships-num { display: inline-block; color: var(--safe-ink); animation: ctb-pop .5s cubic-bezier(.3,1.8,.5,1) both; }
.ships-dots { display: flex; gap: var(--space-1); }
.ships-dots i { width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 3px solid var(--ink-soft); background: var(--paper); transition: background-color .4s, border-color .4s, transform .4s cubic-bezier(.3,1.8,.5,1); }
.ships-dots i.is-on { border-color: var(--ink); background: var(--safe); transform: scale(1.15); }
.ships-done { position: relative; display: flex; align-items: center; justify-content: center; gap: var(--space-4); margin-bottom: var(--space-6); padding: var(--space-3); border-radius: var(--radius-xl); border: 4px solid var(--safe); background: var(--safe-soft); color: var(--ink); }
.ships-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-8); }

/* 6 · parent scan */
.scan { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--space-12); }
.screen--scan { padding-top: var(--space-6); padding-bottom: var(--space-6); }
.scan-back { display: none; }
.scan-side { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-4); color: var(--ink); }
.scan-fams { display: flex; flex-wrap: wrap; gap: var(--space-4); margin-top: var(--space-4); }
.phone-frame { position: relative; width: 372px; height: 704px; overflow: hidden; box-sizing: border-box; border-radius: 52px; border: 10px solid var(--ink); background: var(--paper); box-shadow: var(--shadow-lift); }
.phone-notch { position: absolute; top: 8px; left: 50%; z-index: 20; width: 110px; height: 28px; margin-left: -55px; border-radius: var(--radius-pill); background: var(--ink); }
.pp { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; }
.scanview { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-6); min-height: 100%; box-sizing: border-box; padding: var(--space-12) var(--space-4); background: var(--ink); color: var(--on-fill); overflow: hidden; }
.scan-caption { color: var(--on-fill); }
.scan-hint { display: flex; align-items: center; gap: var(--space-2); color: var(--on-fill); }
.scan-hint .ctb-icon { border-radius: var(--radius-sm); background: var(--card); padding: 2px; }
.scan-target { position: relative; display: grid; place-items: center; width: 260px; height: 260px; }
.scan-box { position: relative; width: 200px; animation: ctb-float 2.2s ease-in-out infinite alternate; }
.scan-box-flap { display: block; height: 22px; margin: 0 14px; border: 4px solid var(--ink); border-bottom: 0; border-radius: var(--radius-sm) var(--radius-sm) 0 0; background: var(--kraft-deep); }
.scan-box-face { display: flex; align-items: center; justify-content: space-around; padding: var(--space-4) var(--space-2); border-radius: var(--radius-sm); border: 4px solid var(--card); background: var(--kraft); }
.sc { position: absolute; width: 48px; height: 48px; box-sizing: border-box; border: 0 solid var(--sun); transition: border-color .3s ease, transform .4s cubic-bezier(.3,1.8,.5,1); animation: corner 1.1s ease-in-out infinite alternate; }
.sc--tl { left: 0; top: 0; border-width: 8px 0 0 8px; border-top-left-radius: 22px; }
.sc--tr { right: 0; top: 0; border-width: 8px 8px 0 0; border-top-right-radius: 22px; }
.sc--bl { left: 0; bottom: 0; border-width: 0 0 8px 8px; border-bottom-left-radius: 22px; }
.sc--br { right: 0; bottom: 0; border-width: 0 8px 8px 0; border-bottom-right-radius: 22px; }
@keyframes corner { from { scale: 1; } to { scale: .9; } }
.scanview.is-found .sc { border-color: var(--safe); animation: none; scale: 1.06; }
.scan-laser { position: absolute; left: 8px; right: 8px; top: 12px; height: 5px; border-radius: 3px; background: var(--sun); box-shadow: 0 0 18px 6px color-mix(in srgb, var(--sun) 60%, transparent); animation: laser 1.1s ease-in-out infinite alternate; }
@keyframes laser { to { top: calc(100% - 16px); } }
.scan-ok { position: absolute; display: grid; place-items: center; animation: ctb-pop .5s cubic-bezier(.3,1.8,.5,1) both; }
.scan-flash { position: absolute; inset: 0; pointer-events: none; background: var(--card); animation: flash .55s ease-out both; }
@keyframes flash { from { opacity: .85; } to { opacity: 0; } }
.parent { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); padding: 52px var(--space-4) var(--space-8); text-align: center; animation: sheet-up .65s cubic-bezier(.3,1.25,.5,1) both; }
.parent-head { position: relative; display: flex; align-items: center; gap: var(--space-3); align-self: stretch; padding: var(--space-2) var(--space-3); text-align: left; border-radius: var(--radius-lg); border: 3px solid var(--line); background: var(--card); color: var(--ink); overflow: hidden; }
.parent-fam { margin-top: var(--space-2); }
.parent-grade { padding: var(--space-4); }
.parent-facts { display: grid; gap: var(--space-3); align-self: stretch; margin: 0; padding: 0; text-align: left; }
.parent-checked { display: flex; align-items: center; gap: var(--space-2); color: var(--ink-soft); }
.parent-report { align-self: stretch; }
.sheet-wrap { position: absolute; inset: 0; z-index: 30; display: flex; align-items: flex-end; background: color-mix(in srgb, var(--ink) 45%, transparent); animation: fade-in .25s ease both; }
.sheet { position: relative; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); width: 100%; max-height: 92%; overflow: auto; box-sizing: border-box; padding: var(--space-3) var(--space-4) var(--space-8);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0; background: var(--card); color: var(--ink); text-align: center; animation: sheet-up .5s cubic-bezier(.3,1.25,.5,1) both; }
.sheet-grip { width: 64px; height: 6px; border-radius: 3px; background: var(--line); }
.sheet-choices { display: grid; gap: var(--space-3); align-self: stretch; }
.choice { display: flex; align-items: center; gap: var(--space-3); min-height: 84px; padding: 0 var(--space-4); border-radius: var(--radius-lg); border: 3px solid var(--line); background: var(--paper); color: var(--ink); text-align: left; cursor: pointer; font-family: var(--font-body);
  animation: ctb-pop-in .45s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d); transition: border-color .2s ease, background-color .2s ease, transform .3s cubic-bezier(.3,1.8,.5,1); }
.choice:hover { border-color: var(--sky); background: var(--sky-soft); transform: translateX(6px); }
.choice:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.choice-pic { display: grid; place-items: center; width: 64px; height: 64px; flex: none; border-radius: var(--radius-sm); background: var(--card); }
.sheet-thanks { position: relative; }
.sheet-thanks .ctb-burst { top: 30%; }

/* phone and narrow layouts */
@container ctb (max-width: 1080px) {
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .fixes { grid-template-columns: 1fr; }
}
@container ctb (max-width: 940px) {
  .talk-stage { grid-template-columns: 1fr; justify-items: center; padding: var(--space-8) var(--space-4); }
  .talk-child { align-items: center; }
  .talk-answer { min-height: 150px; justify-content: center; padding-top: var(--space-4); }
  .talk-controls { flex-direction: column; gap: var(--space-6); }
  .talk-controls .ctb-switch-wrap { order: -1; }
  .talk-next { min-width: 0; justify-content: center; }
  .hint-arrow { display: none; }
  .report-top { grid-template-columns: 1fr; }
  .ships-grid { grid-template-columns: 1fr; }
}
@container ctb (max-width: 820px) {
  .home-hero { flex-direction: column; gap: var(--space-4); }
  .home-words { align-items: center; text-align: center; }
  .home-hi { right: -40px; top: -20px; }
  .scan { display: block; }
  .scan-side { display: none; }
  .scan-back { display: block; margin-bottom: var(--space-4); }
  .phone-frame { width: auto; height: auto; overflow: visible; border: 0; border-radius: 0; box-shadow: none; background: none; }
  .phone-notch { display: none; }
  .pp { position: static; overflow: visible; }
  .scanview { min-height: 560px; border-radius: var(--radius-xl); }
  .parent { padding-top: var(--space-2); }
}
@container ctb (max-width: 640px) {
  .screen { padding: var(--space-4) var(--space-4) var(--space-12); }
  .app .hero { font-size: var(--text-hero-phone); line-height: 1.05; }
  .app .title { font-size: var(--text-title-phone); line-height: 1.1; }
  .head { gap: var(--space-3); }
  .head .title { flex-basis: 100%; order: 2; }
  .flow { order: 3; margin: 0 auto; }
  .home-hi { position: relative; top: auto; right: auto; margin-top: var(--space-4); }
  .home-buddy { padding: 0; }
  .home-pad { bottom: 60px; }
  .home-steps { flex-direction: column; gap: var(--space-2); }
  .home-arrow { rotate: 90deg; }
  .home-steps .ctb-step { flex-direction: row; justify-content: flex-start; width: 290px; box-sizing: border-box; padding: var(--space-3) var(--space-6) var(--space-3) var(--space-6); }
  .home-steps .ctb-step-pic { width: 84px; height: 84px; }
  .home-steps .ctb-step-pic .ctb-icon { width: 60px; height: 60px; }
  .talk-qs { padding-left: 0; }
  .belt-buddy { display: none; }
  .head .head-extra { order: 3; margin: 0 auto; }
  .belt { height: 220px; }
  .belt-gate { scale: .8; transform-origin: bottom center; }
  .rider .ctb-toy { width: 76px; height: auto; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
  .ctb-tile { min-height: 180px; }
  .card { padding: var(--space-6) var(--space-4); }
  .ships-count { padding-right: var(--space-4); }
  .ctb-ship-box { padding: var(--space-6) var(--space-3) var(--space-4); }
  .ctb-ship-label { flex-direction: column; text-align: center; }
  .ctb-ship-action { justify-content: center; }
  .ctb-btn--lg { padding: 0 var(--space-6); }
}

/* self-playing demo */
.app-inner { position: relative; }
.app-body.is-touring .screen { padding-bottom: 128px; }
.hand { position: absolute; left: 0; top: 0; z-index: 45; width: 0; height: 0; pointer-events: none; opacity: 0;
  transition: transform .8s cubic-bezier(.45,.05,.25,1), opacity .3s ease; }
.hand.is-on { opacity: 1; }
.hand-pic { position: absolute; left: -27px; top: -2px; display: block; filter: drop-shadow(0 8px 6px color-mix(in srgb, var(--ink) 22%, transparent)); transform-origin: 27px 2px; animation: hand-press .4s ease; }
.hand-pic svg { display: block; }
@keyframes hand-press { 0%, 100% { transform: none; } 40% { transform: scale(.84) translateY(4px); } }
.hand-ring { position: absolute; left: -24px; top: -24px; width: 48px; height: 48px; box-sizing: border-box; border-radius: 50%; border: 5px solid var(--sky); opacity: 0; animation: ctb-ring-out .65s ease-out; }
.tour-pill { position: absolute; left: 50%; bottom: var(--space-4); z-index: 44; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
  border-radius: var(--radius-pill); background: var(--ink); color: var(--card); box-shadow: var(--shadow-lift); transform: translateX(-50%); white-space: nowrap; animation: tour-in .55s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes tour-in { from { opacity: 0; transform: translate(-50%, 40px); } to { opacity: 1; transform: translateX(-50%); } }
.tour-live i { display: block; width: 12px; height: 12px; border-radius: 50%; background: var(--safe); animation: ctb-glow .6s ease-in-out infinite alternate; }
.tour-steps { display: flex; gap: var(--space-1); margin: 0; padding: 0; list-style: none; }
.tour-steps li { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: color-mix(in srgb, var(--card) 22%, transparent); opacity: .5;
  transition: transform .45s cubic-bezier(.3,1.8,.5,1), opacity .3s ease, background-color .3s ease; }
.tour-steps li.is-done { opacity: .85; }
.tour-steps li.is-on { background: var(--card); opacity: 1; transform: scale(1.18); }
.tour-stop { display: flex; align-items: center; gap: var(--space-1); min-height: var(--tap-min); padding: 0 var(--space-4) 0 var(--space-3); border: 0; border-radius: var(--radius-pill);
  background: var(--card); color: var(--ink); font-family: var(--font-body); cursor: pointer; }
.tour-stop:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.tour-end { position: absolute; inset: 0; z-index: 46; display: grid; place-items: center; padding: var(--space-4); overflow-y: auto;
  background: color-mix(in srgb, var(--paper) 72%, transparent); backdrop-filter: blur(6px); animation: fade-in .4s ease both; }
.tour-end-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); max-width: 440px; box-sizing: border-box; padding: var(--space-8) var(--space-6);
  border-radius: var(--radius-xl); border: 3px solid var(--line); background: var(--card); color: var(--ink); text-align: center; box-shadow: var(--shadow-lift);
  animation: ctb-pop-in .65s cubic-bezier(.3,1.5,.5,1) both; }
.tour-end-steps { display: flex; align-items: center; gap: var(--space-2); }
.tour-end-steps > span { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); }
@container ctb (max-width: 640px) {
  .tour-pill { gap: var(--space-2); padding-left: var(--space-3); }
  .tour-steps li { width: 34px; height: 34px; }
  .tour-steps li .ctb-icon { width: 24px; height: 24px; }
  .tour-end-card { padding: var(--space-6) var(--space-4); }
}
/* on a real phone, drop the fake phone frame and the size switch */
@media (max-width: 520px) {
  .proto { padding: 0; gap: 0; }
  .proto-bar { display: none; }
  .proto-stage--phone .proto-device, .proto-device { max-width: none; max-height: none; border: 0; border-radius: 0; }
}
